<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Sri Lankan peacock inspired data and strategy banner</title>
<desc id="desc">A stylised traditional peacock in burgundy and antique gold beside the words Data, Business and Marketing.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120711"/><stop offset=".54" stop-color="#2A0B18"/><stop offset="1" stop-color="#100711"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5D995"/><stop offset=".48" stop-color="#D79A3E"/><stop offset="1" stop-color="#9C4A24"/></linearGradient>
